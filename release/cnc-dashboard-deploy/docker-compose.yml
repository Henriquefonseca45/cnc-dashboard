services:
  cnc-dashboard:
    build:
      context: .
    image: cnc-dashboard:latest
    container_name: cnc-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: America/Sao_Paulo
      CNC_DB_PATH: /data/cnc.db
    volumes:
      - ./deploy-data:/data
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
