<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel CNC</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; width: 420px; }
    h2 { margin: 0 0 8px 0; }
    .muted { color: #666; font-size: 12px; }
    button { padding: 10px 12px; margin-right: 8px; cursor: pointer; }
    ul { margin: 8px 0; padding-left: 18px; }
    .pill { display:inline-block; padding:2px 8px; border:1px solid #ddd; border-radius:999px; font-size:12px; }
    .danger { border-color:#f0b; }
  </style>
</head>
<body>
  <h1>Painel CNC</h1>
  <div class="muted">Atualiza a cada 2s. Backend: <span id="backendUrl"></span></div>
  <hr />

  <div class="row" id="cards"></div>

  <script>
    const BACKEND = "http://192.168.17.121:8001";
    const MAQUINAS = ["CNC01"]; // depois: ["CNC01","CNC02",...]
    document.getElementById("backendUrl").textContent = BACKEND;

    async function apiGet(path) {
      const r = await fetch(`${BACKEND}${path}`, { headers: { "accept": "application/json" } });
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    async function apiPost(path) {
      const r = await fetch(`${BACKEND}${path}`, { method: "POST", headers: { "accept": "application/json" } });
      const txt = await r.text();
      if (!r.ok) throw new Error(txt);
      return txt ? JSON.parse(txt) : {};
    }

    function el(tag, attrs={}, children=[]) {
      const e = document.createElement(tag);
      Object.entries(attrs).forEach(([k,v]) => e[k] = v);
      children.forEach(c => e.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
      return e;
    }

    function renderCard(data) {
      const fila = data.fila || [];
      const exec = data.arquivo_em_execucao;

      const filaList = el("ul", {}, fila.slice(0, 12).map(x => el("li", {}, [`${x.posicao}. ${x.arquivo}`])));
      if (fila.length === 0) filaList.appendChild(el("li", {}, ["(fila vazia)"]));

      const execText = exec ? exec : "—";
      const execPill = el("span", { className: "pill" }, [exec ? "EXECUTANDO" : "PARADA"]);

      const btnStart = el("button", { onclick: async () => {
        try { await apiPost(`/fila/${data.maquina_id}/iniciar_proximo`); await refresh(); }
        catch(e){ alert(`Erro ao iniciar: ${e.message}`); }
      }}, ["Iniciar próximo"]);

      const btnFinish = el("button", { onclick: async () => {
        try { await apiPost(`/fila/${data.maquina_id}/finalizar`); await refresh(); }
        catch(e){ alert(`Erro ao finalizar: ${e.message}`); }
      }}, ["Finalizar"]);

      return el("div", { className: "card" }, [
        el("h2", {}, [data.maquina_id, " ", execPill]),
        el("div", { className: "muted" }, [`Pasta: ${data.base_path}`]),
        el("p", {}, [el("b", {}, ["Em execução: "]), execText]),
        el("p", {}, [el("b", {}, ["Fila (ENTRADA): "]), `${data.total_na_fila}`]),
        filaList,
        el("div", {}, [btnStart, btnFinish]),
      ]);
    }

    async function refresh() {
      const cards = document.getElementById("cards");
      cards.innerHTML = "";

      for (const mid of MAQUINAS) {
        try {
          const data = await apiGet(`/fila/${mid}?include_done=false`);
          cards.appendChild(renderCard(data));
        } catch (e) {
          const c = el("div", { className: "card" }, [
            el("h2", {}, [mid, " ", el("span", { className: "pill danger" }, ["ERRO"])]),
            el("pre", {}, [e.message])
          ]);
          cards.appendChild(c);
        }
      }
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
