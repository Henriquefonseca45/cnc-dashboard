<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agente CNC</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#0b1220; color:#e5e7eb; margin:0; padding:16px; }
    .card { background:#0f172a; border:1px solid #1f2937; border-radius:16px; padding:16px; max-width:720px; margin:0 auto; box-shadow:0 10px 25px rgba(0,0,0,.35); }
    .row { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .muted { color:#9ca3af; font-size:12px; }
    .btn { padding:10px 12px; border-radius:12px; border:1px solid #334155; background:#0b1220; color:#e5e7eb; font-weight:800; cursor:pointer; }
    .btn.primary { background:#e5e7eb; color:#111827; border-color:#e5e7eb; }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    code { background:#0b1220; border:1px solid #334155; padding:2px 6px; border-radius:8px; }
    .pill { display:inline-flex; gap:8px; align-items:center; border:1px solid #334155; padding:6px 10px; border-radius:999px; font-weight:900; font-size:12px; }
    .ok { border-color:#064e2a; background:#052e1a; }
    .warn { border-color:#5b1111; background:#3a0b0b; }
    a { color:#93c5fd; font-weight:900; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div>
        <div style="font-size:18px;font-weight:950;">Agente CNC</div>
        <div class="muted">Baixar → Executar → Cortado (regra 2: não puxa automático)</div>
      </div>
      <div class="pill" id="statusPill">...</div>
    </div>

    <div style="height:12px;"></div>

    <div class="row">
      <div>
        <div class="muted">Máquina</div>
        <div style="font-size:16px;font-weight:950;" id="mid">-</div>
      </div>
      <div>
        <div class="muted">Atualiza a cada</div>
        <div style="font-size:16px;font-weight:950;">2s</div>
      </div>
    </div>

    <div style="height:12px;"></div>

    <div>
      <div class="muted">Next</div>
      <div style="font-size:14px; margin-top:6px;">
        arquivo: <b id="arquivoNome">-</b>
        <span class="muted">(fila_item_id: <span id="filaItemId">-</span>)</span>
      </div>
      <div class="muted" style="margin-top:6px;">
        status: <code id="st">-</code> • posicao: <code id="pos">-</code>
      </div>
    </div>

    <div style="height:16px;"></div>

    <div class="row" style="flex-wrap:wrap;">
      <button class="btn" id="btnRefresh">Recarregar</button>
      <a id="linkDownload" href="#" target="_blank" rel="noreferrer" class="btn primary" style="display:inline-block;">
        ⬇️ Baixar
      </a>
      <button class="btn" id="btnExecutar">▶️ Executar</button>
      <button class="btn warn" id="btnCortado">✅ Cortado</button>
    </div>

    <div style="height:12px;"></div>
    <div class="muted">
      URL base: <code id="baseUrl"></code>
    </div>

    <div style="height:10px;"></div>
    <div class="muted" id="msg"></div>
  </div>

<script>
  const baseUrl = window.location.origin;
  document.getElementById("baseUrl").textContent = baseUrl;

  // pega maquina_id pela URL: /ui/agente/CNC01
  const parts = window.location.pathname.split("/");
  const maquinaId = parts[parts.length - 1] || "CNC01";
  document.getElementById("mid").textContent = maquinaId;

  let current = null;

  function setMsg(t) { document.getElementById("msg").textContent = t || ""; }

  function setPill(text, kind) {
    const el = document.getElementById("statusPill");
    el.className = "pill " + (kind || "");
    el.textContent = text;
  }

  async function getNext() {
    try {
      const res = await fetch(`${baseUrl}/agente/${maquinaId}/next`);
      const data = await res.json();
      current = data;

      if (!data.pendente) {
        document.getElementById("arquivoNome").textContent = "Nenhum";
        document.getElementById("filaItemId").textContent = "-";
        document.getElementById("st").textContent = "-";
        document.getElementById("pos").textContent = "-";
        document.getElementById("linkDownload").href = "#";
        document.getElementById("linkDownload").style.pointerEvents = "none";
        document.getElementById("btnExecutar").disabled = true;
        document.getElementById("btnCortado").disabled = true;
        setPill("SEM ITENS", "warn");
        return;
      }

      document.getElementById("arquivoNome").textContent = data.arquivo_nome || "-";
      document.getElementById("filaItemId").textContent = data.fila_item_id ?? "-";
      document.getElementById("st").textContent = data.status || "-";
      document.getElementById("pos").textContent = data.posicao ?? "-";

      const dl = data.download_url ? `${baseUrl}${data.download_url}` : "#";
      document.getElementById("linkDownload").href = dl;
      document.getElementById("linkDownload").style.pointerEvents = data.download_url ? "auto" : "none";

      // botões
      document.getElementById("btnExecutar").disabled = !data.fila_item_id;
      document.getElementById("btnCortado").disabled = !(data.status === "EM_EXECUCAO");

      setPill(data.status === "EM_EXECUCAO" ? "EM EXECUÇÃO" : "PRÓXIMO NA FILA", data.status === "EM_EXECUCAO" ? "ok" : "");
      setMsg("");
    } catch (e) {
      setMsg("Erro ao buscar next: " + e);
      setPill("ERRO", "warn");
    }
  }

  async function executar() {
    if (!current?.fila_item_id) return;
    try {
      const res = await fetch(`${baseUrl}/agente/${maquinaId}/fila/${current.fila_item_id}/executar`, {
        method: "POST"
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data?.detail || "Erro executar");
      setMsg("Executando: ok");
      await getNext();
    } catch (e) {
      setMsg("Falha executar: " + e.message);
    }
  }

  async function cortado() {
    if (!current?.fila_item_id) return;
    try {
      const res = await fetch(`${baseUrl}/agente/${maquinaId}/fila/${current.fila_item_id}/cortado`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ ok: true })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data?.detail || "Erro cortado");
      setMsg("CORTADO: ok");
      await getNext();
    } catch (e) {
      setMsg("Falha cortado: " + e.message);
    }
  }

  document.getElementById("btnRefresh").onclick = getNext;
  document.getElementById("btnExecutar").onclick = executar;
  document.getElementById("btnCortado").onclick = cortado;

  getNext();
  setInterval(getNext, 2000);
</script>
</body>
</html>
